[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
getrandom = "0.4.3"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = [
  "chrono",
  "postgres",
  "runtime-tokio",
  "tls-rustls",
  "uuid",
] }
tokio = { version = "1.54.0", features = ["fs", "macros", "rt-multi-thread"] }
toml = "1.1.8"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = [
  "compression-br",
  "fs",
  "timeout",
  "trace",
] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["axum"] }
uuid = { version = "1.28.0", features = ["serde", "v7"] }

[dev-dependencies]
